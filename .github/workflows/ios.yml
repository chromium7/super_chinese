name: iOS

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check offline sources
        run: python3 scripts/check_offline.py
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build app and embedded widget
        run: >-
          xcodebuild -project HanziLevels.xcodeproj -scheme HanziLevels
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          devices = json.loads(subprocess.check_output([
              "xcrun", "simctl", "list", "devices", "available", "--json"
          ]))["devices"]
          iphones = [device for runtime, group in devices.items() if ".iOS-" in runtime
                     for device in group if device["name"].startswith("iPhone")]
          if not iphones:
              raise SystemExit("No available iPhone simulator")
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"SIMULATOR_ID={iphones[0]['udid']}\n")
          PY
      - name: Run unit tests
        run: >-
          xcodebuild -project HanziLevels.xcodeproj -scheme HanziLevels
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath build/DerivedData
          -resultBundlePath build/TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO test
