name: iOS shell

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build, exercise navigation, and capture both appearances
        run: bash scripts/ios_ci.sh
      - name: Upload simulator screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-shell-evidence
          path: |
            build/Screenshots/
            build/*.xcresult
          if-no-files-found: error
